<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fce7f3" />
    <title>Block 1 Management</title>
    <style>
      body{margin:0;font-family:Arial,sans-serif;background:#fff9fc;color:#342632}
      #startup-fallback{min-height:100vh;display:grid;place-content:center;text-align:center;padding:24px;box-sizing:border-box}
      #startup-fallback p{color:#806d79;font-size:14px}
      #startup-fallback small{color:#9b8792}
    </style>
  </head>
  <body>
    <div id="root">
      <div id="startup-fallback">
        <h2>Block 1 Management</h2>
        <p>Connecting to the application…</p>
        <small>Please wait a moment.</small>
      </div>
    </div>
    <script>
      window.setTimeout(function(){
        var root=document.getElementById('root');
        var fallback=document.getElementById('startup-fallback');
        if(fallback && root && root.contains(fallback)){
          fallback.innerHTML='<h2>Block 1 Management</h2><p>The application could not start.</p><small>Refresh once. If this message remains, the app script failed to load. Please share this screen.</small>';
        }
      },12000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
